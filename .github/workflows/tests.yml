name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/general-video-analysis/requirements.txt
          python -m pip install -r skills/professional-video-analysis/requirements.txt
      - name: General video analysis
        run: python -m unittest discover -s skills/general-video-analysis/tests -v
      - name: Professional video analysis
        run: python -m unittest discover -s skills/professional-video-analysis/tests -v
