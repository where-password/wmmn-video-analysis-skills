name: Compatibility report
description: Report URL, media-handle, or host compatibility
title: "[Compatibility] "
labels: ["compatibility", "community-report"]
body:
  - type: input
    id: source_type
    attributes:
      label: Source type
      placeholder: "Public URL, host media handle, or local file"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or container
      placeholder: "YouTube, Bilibili, Douyin, local MP4, etc."
  - type: input
    id: resolution
    attributes:
      label: Resolution and duration
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - media acquisition
        - general scan
        - mechanics measurement
        - evidence frames
        - professional report
        - no failure
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Redacted details
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private URLs, local paths, and personal data.
          required: true
